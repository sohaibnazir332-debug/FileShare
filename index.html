<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<meta name="description" content="Send files between phone and PC directly. No install, no upload to any server.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FileShare — send files anywhere</title>
<style>
:root{--bg:#0b0f1a;--card:#131a2a;--line:#222c44;--text:#e8ecf6;--mut:#8a96b3;--acc:#5b7cff;--acc2:#8b5cf6;--ok:#22c55e;--err:#ef4444;--r:18px}
:root.light{--bg:#f3f5fb;--card:#fff;--line:#e3e8f2;--text:#141a2b;--mut:#6a7592}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,"Noto Nastaliq Urdu",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:env(safe-area-inset-top) 0 40px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo i{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal;color:#fff}
.row{display:flex;align-items:center;gap:10px}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--ok)}.dot.err{background:var(--err)}.dot.wait{background:#f59e0b}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.tab{border:1px solid var(--line);background:transparent;color:var(--mut);padding:9px 16px;border-radius:99px;cursor:pointer;font:600 14px inherit;font-family:inherit;white-space:nowrap}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.panel{display:none}.panel.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:14px;font-weight:600}
.card+.card{margin-top:0}
.code{font:700 34px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.me{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#qr{background:#fff;padding:8px;border-radius:12px;line-height:0}
.btn{border:0;cursor:pointer;font:600 14px inherit;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));padding:11px 16px;border-radius:12px;transition:.15s;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.35;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:var(--err)}
input[type=text],input[type=password],textarea,select{width:100%;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px;font:inherit;outline:none}
select option{background:var(--card);color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
#join{text-transform:uppercase;letter-spacing:.2em;font-family:ui-monospace,Consolas,monospace;font-size:18px;direction:ltr}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:34px 16px;text-align:center;color:var(--mut);cursor:pointer;transition:.2s}
.drop.over{border-color:var(--acc);background:rgba(91,124,255,.08);color:var(--text)}
.drop b{display:block;font-size:17px;color:var(--text);margin-bottom:4px}
.peers{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.peer{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.peer .nm2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub2{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(91,124,255,.15);color:var(--acc);font-weight:700;flex:none}
.item.in .ic{background:rgba(34,197,94,.15);color:var(--ok)}
.mid{flex:1;min-width:0}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;direction:ltr;text-align:start}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:7px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .15s}
.item.done .bar i{background:var(--ok)}.item.fail .bar i{background:var(--err)}
.sub{font-size:12px;color:var(--mut)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ib{padding:6px 10px;font-size:13px}
.msg{padding:10px 12px;border-radius:12px;background:rgba(139,92,246,.12);word-break:break-word;white-space:pre-wrap;cursor:pointer}
.msg.out{background:rgba(91,124,255,.12)}
.msg small{display:block;color:var(--mut);margin-bottom:3px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:14px;margin-top:12px}
label.chk input{width:auto}
.field{margin-top:12px}.field>label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);background:var(--card);border:1px solid var(--line);padding:11px 18px;border-radius:12px;transition:.3s;z-index:50;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.full{grid-column:1/-1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,8,15,.65);display:none;align-items:center;justify-content:center;z-index:30;padding:16px;backdrop-filter:blur(4px)}
.modal.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;max-width:420px;width:100%}
.sheet.big{max-width:920px;max-height:92vh;overflow:auto}
.vcode{font:700 30px ui-monospace,monospace;letter-spacing:.25em;text-align:center;margin:14px 0;direction:ltr}
.viewer img,.viewer video{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:10px}
.viewer iframe{width:100%;height:70vh;border:0;border-radius:10px;background:#fff}
.viewer pre{white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Consolas,monospace;max-height:70vh;overflow:auto;direction:ltr;text-align:left}
/* file manager */
.stor{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.stor i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0}
.fm-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fm-tools input[type=text]{width:160px;padding:8px 10px}
.fm-tools select{width:auto;padding:8px 10px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;color:var(--mut);direction:ltr}
.crumbs a{cursor:pointer;color:var(--acc)}
.fm-list{display:flex;flex-direction:column;gap:4px}
.frow{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;border:1px solid transparent;cursor:pointer;position:relative}
.frow:hover{background:rgba(91,124,255,.07)}
.frow.sel{border-color:var(--acc);background:rgba(91,124,255,.12)}
.frow .ck{width:auto;flex:none}
.fico{font-size:24px;width:38px;text-align:center;flex:none}
.finfo{min-width:0;flex:1}
.finfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;direction:ltr;text-align:start}
.fmeta{font-size:12px;color:var(--mut)}
.fm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.fm-grid .frow{flex-direction:column;text-align:center;padding:12px 8px;border-color:var(--line)}
.fm-grid .frow .ck{position:absolute;top:8px;inset-inline-start:8px}
.fm-grid .fico{width:100%;height:84px;display:grid;place-items:center;font-size:42px;overflow:hidden}
.fm-grid .fico img{max-width:100%;max-height:84px;border-radius:8px}
.fm-grid .finfo{width:100%}
.note{padding:12px;border-radius:12px;background:rgba(245,158,11,.12);color:var(--text);margin-bottom:12px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
html[dir=rtl] .code,html[dir=rtl] #join{text-align:left}
/* ---- v3: global fixes ---- */
[hidden]{display:none!important}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
#toast{bottom:calc(92px + env(safe-area-inset-bottom));pointer-events:none;opacity:0;transform:translate(-50%,20px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
header .row{flex-wrap:nowrap}header .btn,header .pill{flex:none;white-space:nowrap}
/* bottom navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;gap:0;margin:0;overflow:visible;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;border-radius:14px;padding:4px;color:var(--mut);font:600 11px inherit;font-family:inherit}
.tab .ti{font-size:20px;line-height:1;padding:4px 20px;border-radius:99px;transition:.15s}
.tab.on{background:transparent;color:var(--text);border:0}
.tab.on .ti{background:rgba(91,124,255,.22)}
/* app bar */
.gbar{display:flex;align-items:center;gap:2px;min-height:52px;position:sticky;top:0;z-index:6;background:var(--bg);padding:4px 0}
.gbar .gt{flex:1;min-width:0;font-size:21px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 8px}
.ibtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--text);font-size:20px;cursor:pointer;display:grid;place-items:center;flex:none;font-family:inherit}
.ibtn:hover{background:rgba(127,127,127,.16)}
.gsearch{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 6px;margin:6px 0;position:sticky;top:0;z-index:6}
.gsearch input{border:0;flex:1;background:transparent;padding:10px 6px;border-radius:0;min-width:0}
.gcr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--mut);margin:2px 2px 10px;direction:ltr;font-size:14px}
.gcr a{cursor:pointer;color:var(--acc)}.gcr .sep{opacity:.6}
.gsec{font-size:13px;font-weight:600;color:var(--mut);margin:20px 2px 10px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:6px}
.gcard .gst{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gcard .stor{margin:10px 0 8px}
.gcats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gcat{border:1px solid var(--line);border-radius:18px;padding:14px 6px 12px;text-align:center;cursor:pointer;background:var(--card);transition:.12s;min-width:0}
.gcat:hover{border-color:var(--acc)}
.gcat .ci{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:23px}
.gcat .cn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcat .sub2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grecent{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.grecent::-webkit-scrollbar{display:none}
.rc{width:104px;flex:none;cursor:pointer}
.rc .gth{border-radius:14px;overflow:hidden}
.gn{font-size:12.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
.gm{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gth{aspect-ratio:1;display:grid;place-items:center;font-size:38px;background:rgba(91,124,255,.1);position:relative;overflow:hidden}
.gi{width:100%;height:100%;display:grid;place-items:center}
.gi img{width:100%;height:100%;object-fit:cover}
/* list rows */
.gf-list{display:flex;flex-direction:column;gap:2px}
.grow{display:flex;align-items:center;gap:14px;padding:7px 4px;border-radius:16px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative}
.grow:hover{background:rgba(127,127,127,.09)}
.grow.sel{background:rgba(91,124,255,.18)}
.gic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(91,124,255,.12);overflow:hidden;flex:none;position:relative}
.ginfo{flex:1;min-width:0}
.ginfo b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
.ginfo span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gchk{position:absolute;inset:0;display:none;place-items:center;background:var(--acc);color:#fff;font-size:22px;font-weight:700}
.sel .gchk{display:grid}
/* grid tiles */
.gf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.gtile{position:relative;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gtile .gn{padding:6px 8px 0}.gtile .gm{padding:0 8px 7px}
.gtile.sel{outline:3px solid var(--acc);outline-offset:-3px}
.gtd{position:absolute;top:6px;inset-inline-end:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:16px;cursor:pointer;z-index:2}
.gtile.sel .gchk{background:rgba(91,124,255,.55)}
.gempty{text-align:center;color:var(--mut);padding:54px 10px}
.gempty .gei{font-size:54px;margin-bottom:8px}
/* fab + menu + pickers */
.fab{position:fixed;inset-inline-end:20px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:19px;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:30px;box-shadow:0 10px 28px rgba(0,0,0,.4);z-index:15;cursor:pointer;display:none;place-items:center}
.fab.on{display:grid}
.gmenu{position:fixed;z-index:70;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:200px;box-shadow:0 14px 36px rgba(0,0,0,.45);white-space:pre}
.gmenu button{display:block;width:100%;text-align:start;background:none;border:0;color:var(--text);padding:11px 12px;border-radius:10px;font:inherit;cursor:pointer}
.gmenu button:hover{background:rgba(127,127,127,.16)}
.gmenu button.danger{color:var(--err)}
.gmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#mDlg{z-index:80}
.pklist{max-height:44vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.pkrow{padding:11px 10px;border-radius:12px;cursor:pointer;direction:ltr}
.pkrow:hover{background:rgba(127,127,127,.14)}
#dI{margin-top:6px}

/* ---- v3.1: clear selection + quick actions ---- */
.gck{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;font-size:16px;font-weight:700}
.gck::after{content:'✓';opacity:0}
.sel .gck{background:var(--acc);border-color:var(--acc)}.sel .gck::after{opacity:1}
.grow .ibtn{width:38px;height:38px}
.gdel{font-size:18px}
.grow.sel{background:rgba(91,124,255,.16);outline:2px solid var(--acc);outline-offset:-2px}
.gtile .gck{position:absolute;top:6px;inset-inline-start:6px;z-index:2;background:rgba(0,0,0,.4);border-color:#fff}
.gtile.sel .gck{background:var(--acc);border-color:var(--acc)}
.gplay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.gplay i{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.58);color:#fff;font-style:normal;font-size:11px;display:grid;place-items:center;padding-inline-start:2px}
.gic .gplay i{width:20px;height:20px;font-size:9px}
#dImg{display:block;max-width:100%;max-height:170px;border-radius:12px;margin:12px auto 2px;object-fit:contain}
/* ---- v3.2: play/view in place ---- */
.ginline{position:relative;margin:4px 0 10px;border-radius:14px;overflow:hidden;background:#000;display:block}
.ginline.aud{background:transparent}
.ginline video,.ginline img{display:block;width:100%;max-height:44vh;object-fit:contain;background:#000}
.ginline audio{width:100%;display:block}
.ginx{position:absolute;top:6px;inset-inline-end:6px;width:32px!important;height:32px!important;background:rgba(0,0,0,.6);color:#fff;font-size:15px;z-index:3}
.dlist{max-height:46vh;overflow:auto;margin:12px 0 4px;display:flex;flex-direction:column;gap:6px}
.dli{display:flex;align-items:center;gap:12px;padding:6px;border-radius:14px;border:1px solid var(--line)}
.dli .gic{width:56px;height:56px}
/* ---- v4A: bin / private / clean ---- */
.gnote{padding:12px 14px;border-radius:14px;background:rgba(91,124,255,.1);color:var(--mut);font-size:13px;margin:6px 0 14px;white-space:pre-line}
.gcl{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:16px;cursor:pointer;background:var(--card);margin-bottom:8px}
.gcl:hover{border-color:var(--acc)}
.gcl .ci{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}
.gcl .chev{font-size:26px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i>⇄</i>FileShare</div>
    <div class="row">
      <div class="pill"><span class="dot" id="sdot"></span><span id="stxt">…</span></div>
      <button class="btn ghost sm" id="langBtn">اردو</button>
      <button class="btn ghost sm" id="themeBtn" title="Theme">🌓</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab on" data-tab="files"><span class="ti">📁</span><span data-i="tabFiles"></span></button>
    <button class="tab" data-tab="share"><span class="ti">⇄</span><span data-i="tabShare"></span></button>
    <button class="tab" data-tab="hist"><span class="ti">🕘</span><span data-i="tabHist"></span></button>
    <button class="tab" data-tab="set"><span class="ti">⚙️</span><span data-i="tabSet"></span></button>
  </nav>

  <!-- SHARE -->
  <section class="panel" id="p-share">
    <div class="grid">
      <div class="card">
        <h2 data-i="thisDev">This device</h2>
        <div class="me">
          <div id="qr"></div>
          <div>
            <div class="code" id="code">······</div>
            <div class="sub" style="margin:8px 0 12px" data-i="scanHint"></div>
            <div class="row"><button class="btn sm" id="copy" data-i="copyLink"></button><button class="btn ghost sm" id="newcode" data-i="newCode"></button></div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 data-i="connTitle">Connect</h2>
        <div class="row"><input type="text" id="join" maxlength="6" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="btn" id="go" data-i="connect"></button></div>
        <div class="peers" id="peers"></div>
        <div class="sec"><button class="btn ghost sm" id="offBtn" data-i="offBtn"></button></div>
        <div class="sec"><div class="sub2" data-i="myDevs" style="margin-bottom:8px"></div><div class="peers" id="known"></div></div>
      </div>

      <div class="card full">
        <h2 data-i="send">Send</h2>
        <div class="drop" id="drop"><b data-i="dropT"></b><span data-i="dropS"></span></div>
        <input type="file" id="files" multiple hidden>
        <input type="file" id="folder" webkitdirectory hidden>
        <input type="file" id="camP" accept="image/*" capture="environment" hidden>
        <input type="file" id="camV" accept="video/*" capture="environment" hidden>
        <div class="row" style="margin-top:12px;flex-wrap:wrap">
          <button class="btn ghost sm" id="pickFiles" data-i="pickFiles"></button>
          <button class="btn ghost sm" id="pickFolder" data-i="pickFolder"></button>
          <button class="btn ghost sm" id="camPB" data-i="camPhoto" hidden></button><button class="btn ghost sm" id="camVB" data-i="camVideo" hidden></button>
        </div>
        <div style="margin-top:14px"><textarea id="txt" rows="2" data-ph="txtPh"></textarea>

const OPFS=!!(navigator.storage&&navigator.storage.getDirectory&&window.FileSystemFileHandle&&FileSystemFileHandle.prototype.createWritable);
let ROOT=null;
async function root(){if(!ROOT){const r=await navigator.storage.getDirectory();ROOT=await r.getDirectoryHandle('library',{create:true})}return ROOT}
const clean=s=>s.replace(/[\\:*?"<>|\x00-\x1f]/g,'_').trim()||'_';
const splitPath=p=>{const a=p.split('/').filter(x=>x&&x!=='.'&&x!=='..').map(clean);if(a[0]==='.trash'||a[0]==='.private')a[0]='_'+a[0];return a};
async function dirAt(parts,create){let d=await root();for(const p of parts)d=await d.getDirectoryHandle(p,{create:!!create});return d}
async function exists(dir,name){try{await dir.getFileHandle(name);return true}catch(e){}try{await dir.getDirectoryHandle(name);return true}catch(e){}return false}
async function uniqueName(dir,name){
  if(!(await exists(dir,name)))return name;
  const i=name.lastIndexOf('.'),b=i>0?name.slice(0,i):name,x=i>0?name.slice(i):'';
  for(let n=1;;n++){const c=b+' ('+n+')'+x;if(!(await exists(dir,c)))return c}
}
async function finalize(dir,partName,finalName){
  const fh=await dir.getFileHandle(partName);
  if(fh.move){try{await fh.move(finalName);return}catch(e){}}

}

  c.on('data',d=>onData(c,d));

/* ================= messages ================= */
function onData(c,d){
  if(typeof d==='string'){let m;try{m=JSON.parse(d)}catch(e){return}onMsg(c,m)}
  else if(c.ok)onChunk(c,d);
}
function onMsg(c,m){
  if(m.t==='hello'){
    c.label=m.name;c.did=m.id;c.vcode=vcode(DID,m.id);
    if(c.incoming&&!c.ok&&m.dl&&!c.offline&&dlValid(m.dl)){c.limited=m.dl;c.ok=true;c.send(JSON.stringify({t:'accept'}));dlSend(c,m.dl);renderPeers();return}
    if(c.incoming&&!c.ok){const k=known().find(x=>x.id===m.id&&x.trusted);if(c.offline)grant(c,false);else if(k)grant(c,true);else ask(c)}
    renderPeers();return;
  }
  if(m.t==='accept'){if(!c.incoming&&!c.ok){c.ok=true;if(!c.offline)saveKnown({id:c.did,name:c.label,code:c.peer.slice(7)});onReady(c)}return}
  if(m.t==='deny'){toast(t('denied'));c.close();return}
  if(!c.ok)return;
  if(c.limited&&['meta','text','clip','ls','get','end'].includes(m.t))return;
  const it=ITEMS.get(m.id);
  switch(m.t){
    case'info':c.free=m.free;c.stream=!!m.stream;renderPeers();break;
    case'syn':onSyn(c,m);break;
    case'synreq':onSynReq(c,m);break;
    case'synoffer':onSynOffer(c,m);break;
    case'synok':if(synOkName(m.folder)){synAddPair(c,m.folder);toast(t('syncOn').replace('{f}',m.folder));synSend(c)}break;
    case'synstop':if(synFor(c,m.folder)){synDelPair(c,m.folder);toast(t('syncStopped'))}break;
    case'ls':onLs(c,m);break;
    case'lsr':{const f=REMP.get(m.id);if(f){REMP.delete(m.id);f(m)}break}
    case'get':onGet(c,m);break;
    case'clip':onClip(c,m);break;
    case'text':addText(m.text,c.label||'Device','in');histAdd({n:m.text.slice(0,80),s:0,d:'in',p:c.label,x:1});break;
    case'meta':onMeta(c,m);break;
    case'end':onEnd(c,m);break;
    case'ready':it&&it.readyP&&it.readyP.res(m);break;
    case'reject':it&&it.readyP&&it.readyP.rej(new Error(m.why==='space'?t('noSpaceTx').replace('{need}',fmt(m.need||0)).replace('{free}',fmt(m.free||0)):(m.why||'rejected')));break;
    case'full':if(it){it.stopFull=true;it.readyP&&it.readyP.rej(new Error('rxfull'));it.doneP&&it.doneP.rej(new Error('rxfull'))}break;
    case'ack':if(it)it.acked=m.n;break;
    case'done':it&&it.doneP&&it.doneP.res(m);break;
    case'ctl':onCtl(c,m,it);break;
  }
}
function onCtl(c,m,it){
  if(!it)return;
  if(m.op==='pause'){it.paused=true;setState(it,'paused')}
  else if(m.op==='resume'){it.paused=false;setState(it,'run')}
  else if(m.op==='cancel'){
    it.cancel=true;it.cancelled=true;
    if(it.dir==='in')abortRx(c,it);
    else{it.readyP&&it.readyP.rej(new Error('cancel'));it.doneP&&it.doneP.rej(new Error('cancel'));if(it.state==='queued'||it.state==='paused')fail(it,t('cancelled'),true)}
  }
}
const ctl=(it,op)=>{const c=conns.get(it.peerId);if(c&&c.ok)try{c.send(JSON.stringify({t:'ctl',id:it.id,op}))}catch(e){}};

function fail(it,why,cancelled){if(cancelled)it.cancelled=true;setState(it,'fail');it.sub.textContent='✕ '+(why||'error');

/* ================= receive ================= */
async function onMeta(c,m){
  const item=addItem({id:m.id,key:m.key,name:m.name,size:m.size,dir:'in',peerId:c.peer});
  const rx={item,m,v:!!m.verify,crc:undefined,got:0,acked:0,q:Promise.resolve(),w:null,chunks:[],dir:null,rec:null};
  c._rx=rx;let offset=0;
  try{
    if(OPFS){
      const parts=splitPath(m.name),fname=parts.pop()||'file',dir=await dirAt(parts,true),pj=parts.join('/');
      const P=store.get('part',{});let rec=P[m.key];
      if(rec&&rec.size===m.size&&rec.dir===pj){
        try{offset=(await (await dir.getFileHandle(rec.name+'.part')).getFile()).size;if(offset>=m.size)offset=0}catch(e){offset=0}
      }else rec=null;
      {
        const need=m.size-offset;let free=Infinity;
        try{const e=await navigator.storage.estimate();if(e&&e.quota)free=e.quota-e.usage}catch(x){}
        if(need+52428800>free){
          free=Math.max(0,free);
          try{c.send(JSON.stringify({t:'reject',id:m.id,why:'space',need,free}))}catch(x){}
          c._rx=null;fail(item,t('noSpaceRx').replace('{need}',fmt(need)).replace('{free}',fmt(free)));return;
        }
      }
      if(!rec||!offset){rec={dir:pj,name:await uniqueName(dir,fname),size:m.size};offset=0}
      P[m.key]=rec;store.set('part',P);
      const h=await dir.getFileHandle(rec.name+'.part',{create:true});
      if(rx.v&&offset>0)rx.crc=await crcOfBlob((await h.getFile()).slice(0,offset));
      rx.w=await h.createWritable({keepExistingData:offset>0});if(offset>0)await rx.w.seek(offset);
      rx.dir=dir;rx.rec=rec;
    }
  }catch(e){console.warn('OPFS fallback',e);rx.w=null;rx.dir=null;offset=0;rx.chunks=[]}
  rx.got=offset;rx.acked=offset;item.base=offset;item.t0=performance.now();setState(item,'run');progress(item,offset);
  c.send(JSON.stringify({t:'ready',id:m.id,offset}));
}
function onChunk(c,d){
  const r=c._rx;if(!r)return;
  r.q=r.q.then(async()=>{
    if(r.err||r.dead)return;
    if(r.w)await r.w.write(d);else r.chunks.push(d);
    if(r.v)r.crc=crc32(d instanceof Uint8Array?d:new Uint8Array(d),r.crc);
    r.got+=d.byteLength;progress(r.item,r.got);
    if(r.got-r.acked>=ACKSTEP){r.acked=r.got;c.send(JSON.stringify({t:'ack',id:r.m.id,n:r.got}))}
  }).catch(e=>{r.err=e;if(e&&e.name==='QuotaExceededError')rxFull(c,r)});
}
async function rxFull(c,r){
  if(r.full)return;r.full=true;r.dead=true;if(c._rx===r)c._rx=null;
  try{if(r.w){try{await r.w.close()}catch(x){try{await r.w.abort()}catch(y){}}r.w=null}}catch(x){}
  try{c.send(JSON.stringify({t:'full',id:r.m.id}))}catch(x){}
  fail(r.item,t('fullRx'));
}
async function onEnd(c,m){
  const r=c._rx;if(!r||r.m.id!==m.id)return;c._rx=null;const it=r.item;
  try{
    await r.q;if(r.err)throw r.err;if(r.got!==r.m.size)throw new Error('size mismatch');
    if(r.v&&m.crc!==undefined){
      if(((r.crc===undefined?0:r.crc)>>>0)!==(m.crc>>>0)){
        try{if(r.w)await r.w.abort()}catch(x){}r.w=null;
        if(r.dir){try{await r.dir.removeEntry(r.rec.name+'.part')}catch(x){}const P=store.get('part',{});delete P[r.m.key];store.set('part',P)}
        fail(it,t('verifyFail'));try{c.send(JSON.stringify({t:'done',id:m.id,ok:false}))}catch(x){}return;
      }
      it.verified=true;
    }
    if(r.w){
      await r.w.close();r.w=null;await finalize(r.dir,r.rec.name+'.part',r.rec.name);
      const P=store.get('part',{});delete P[r.m.key];store.set('part',P);
      it.path=[r.rec.dir,r.rec.name].filter(Boolean).join('/');
      if(r.m.pack){
        try{
          const pd=await dirAt(r.rec.dir?r.rec.dir.split('/'):[],true),zf=await (await pd.getFileHandle(r.rec.name)).getFile();
          it.packed=await unpackZip(zf,pd,r.rec.name.replace(/\.zip$/i,'')||'pack',!!r.m.merge,r.rec.dir);
          await pd.removeEntry(r.rec.name);it.path='';it.pcPath=r.m.merge?'':[r.rec.dir,UNZ.name].filter(Boolean).join('/');if(r.m.merge)it.pcFiles=UNZ.files.slice();
        }catch(x){console.warn('unpack',x)}
      }
    }else{it.url=URL.createObjectURL(new Blob(r.chunks,{type:r.m.type||'application/octet-stream'}));it.saveName=r.m.name.split('/').pop();r.chunks=[]}
    finish(it);c.send(JSON.stringify({t:'done',id:m.id,ok:it.verified?true:undefined}));sendInfo(c);
    if(S.autosave||DLMODE)saveFromItem(it);
    libDirty();
    if(S.pcsave&&PCH)pcSaveItem(it,false).then(ok=>{if(ok)pcDrop(it)});
  }catch(e){fail(it,e.message);try{c.send(JSON.stringify({t:'ctl',id:m.id,op:'cancel'}))}catch(x){}}
}
async function abortRx(c,it){
  const r=c._rx;if(!r||r.item!==it){fail(it,t('cancelled'),true);return}
  c._rx=null;r.dead=true;try{await r.q}catch(e){}
  try{if(r.w)await r.w.abort()}catch(e){}
  if(r.dir){try{await r.dir.removeEntry(r.rec.name+'.part')}catch(e){}const P=store.get('part',{});delete P[it.key];store.set('part',P)}
  fail(it,t('cancelled'),true);
}
async function saveFromItem(it){
  try{
    if(it.path){const f=await libFile(it.path);saveFile(f,it.path.split('/').pop())}
    else if(it.url){const a=document.createElement('a');a.href=it.url;a.download=clean(it.saveName||it.name);document.body.appendChild(a);a.click();a.remove()}
  }catch(e){toast(e.message)}
}

function targets(){const ts=[...conns.values()].filter(c=>c.ok&&!c.limited&&c.sel!==false);if(!ts.length){toast(t('connFirst'));return null}return ts}
async function maybeCompress(file,name){

async function videoFrame(f){
  const v=document.createElement('video');v.muted=true;v.preload='auto';v.playsInline=true;const u=URL.createObjectURL(f);v.src=u;
  try{
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=rej;setTimeout(rej,5000)});

    const w=160,h=Math.round(w*(v.videoHeight||90)/(v.videoWidth||160));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(v,0,0,w,h);return cv;
  }finally{URL.revokeObjectURL(u);v.removeAttribute('src');try{v.load()}catch(x){}}
}
async function thumb(e){

      const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.7));if(b)url=URL.createObjectURL(b);

function bindEntry(node,e){
  let timer=null,long=false,sx=0,sy=0;
  const cancel=()=>clearTimeout(timer);
  node.addEventListener('pointerdown',ev=>{
    if(ev.target.closest('.gx'))return;
    long=false;sx=ev.clientX;sy=ev.clientY;
    timer=setTimeout(()=>{long=true;toggleSel(e,true)},480);
  });
  node.addEventListener('pointermove',ev=>{if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>10)cancel()});
  ['pointerup','pointerleave','pointercancel'].forEach(n=>node.addEventListener(n,cancel));
  node.addEventListener('click',ev=>{
    if(ev.target.closest('.gx'))return;
    if(long){long=false;return}

/* ---- operations ---- */
async function copyTo(srcH,kind,destDir,name){
  const nm=await uniqueName(destDir,name);
  if(kind==='file'){
    const f=await srcH.getFile(),h=await destDir.getFileHandle(nm,{create:true}),w=await h.createWritable();
    await f.stream().pipeTo(w);
  }else{
    const nd=await destDir.getDirectoryHandle(nm,{create:true});
    for await(const [n,h] of srcH.entries()){if(h.kind==='file'&&n.endsWith('.part'))continue;await copyTo(h,h.kind,nd,n)}
  }
  return nm;
}
const opSend=G(async es=>{
  const go=()=>document.querySelector('.tab[data-tab=share]').click();
  if(![...conns.values()].some(c=>c.ok)){go();toast(t('connFirst'));return}
  const list=[];
  for(const e of es){if(e.kind==='file')list.push({file:e.f,name:e.name});else for await(const x of walk(e.h,e.name+'/'))list.push(x)}
  clearSel();go();await sendFiles(list);
});
const opDownload=G(async es=>{
  let n=0;for(const e of es){if(e.kind==='file'){saveFile(e.f,e.name);n++}}
  if(!n)toast(t('noFiles'));
});
const opDelete=G(async es=>{
  const tot=es.reduce((n,e)=>n+(e.kind==='file'?e.size:0),0);
  const note=(es.length>1?es.length+' · '+fmt(tot)+'\n':'')+t('checkHint')+'\n'+t('delNote');
  const ok=await dlg({title:t('confirmDel').replace('{n}',es.length),msg:note,items:es,ok:t('del'),danger:true});

});
const opRename=G(async e=>{
  const v=await dlg({title:t('rename'),input:e.name,ok:t('rename')});
  if(!v||v===e.name)return;
  const nm=clean(v),d=await dirAt(parentParts(e.path),false);
  if(await exists(d,nm))return toast(t('exists'));
  let done=false;
  if(e.h.move){try{await e.h.move(nm);done=true}catch(x){}}
  if(!done){await copyTo(e.h,e.kind,d,nm);await d.removeEntry(e.name,{recursive:true})}
  clearSel();libDirty();
});
const opMove=G(async(es,copy)=>{
  const target=await pickFolder(copy?t('copyT'):t('moveT'),copy?t('copyHere'):t('moveHere'),es.filter(e=>e.kind==='dir').map(e=>e.path));
  if(!target)return;
  const dd=await dirAt(target,true),tp=target.join('/');
  for(const e of es){
    const pp=parentParts(e.path).join('/');
    if(!copy&&pp===tp)continue;
    if(e.kind==='dir'&&(tp+'/').startsWith(e.path+'/'))throw new Error(t('notSupported'));
    await copyTo(e.h,e.kind,dd,e.name);
    if(!copy){const sd=await dirAt(parentParts(e.path),false);await sd.removeEntry(e.name,{recursive:true})}
  }
  clearSel();libDirty();
});
const opInfo=G(async e=>{

/* ---- Recycle bin ---- */
const TRASH='.trash',PRIVD='.private';
const trashList=()=>store.get('trash',[]);
const trashDir=async()=>(await root()).getDirectoryHandle(TRASH,{create:true});
async function dirSize(h){let s=0;for await(const x of walk(h,''))s+=x.file.size;return s}
async function toTrash(e){
  try{
    const top=e.path.split('/')[0];
    if(synOn(top)){
      const L=synSkip();
      if(e.kind==='file')L.push(e.path);else for await(const x of walk(e.h,''))L.push(e.path+'/'+x.name);
      store.set('synskip',L.slice(-5000));
    }
  }catch(x){}
  const td=await trashDir(),id=rid(),sub=await td.getDirectoryHandle(id,{create:true});
  const size=e.kind==='file'?e.size:await dirSize(e.h);
  let moved=false;
  if(e.h.move){try{await e.h.move(sub,e.name);moved=true}catch(x){}}
  if(!moved){await copyTo(e.h,e.kind,sub,e.name);const sd=await dirAt(parentParts(e.path),false);await sd.removeEntry(e.name,{recursive:true})}
  const L=trashList();L.unshift({id,name:e.name,path:e.path,kind:e.kind,size,ts:Date.now()});store.set('trash',L);
}
function ago(ts){const d=(Date.now()-ts)/1000;if(d<60)return t('justNow');if(d<3600)return Math.floor(d/60)+' min';if(d<86400)return Math.floor(d/3600)+' h';return Math.floor(d/86400)+' d'}
async function viewBin(){

  for(const rec of L){

      const sub=await td.getDirectoryHandle(rec.id);

      const f=rec.kind==='file'?await h.getFile():null;
      rows.push({rec,e:{name:rec.name,path:TRASH+'/'+rec.id+'/'+rec.name,kind:rec.kind,size:rec.size,mtime:rec.ts,type:f?f.type:'',h,f,count:0}});keep.push(rec);
    }catch(x){}
  }
  if(keep.length!==L.length)store.set('trash',keep);
  w.append(mk('div','gnote',t('binNote')));
  LIB.cur=[];
  if(!rows.length){w.append(emptyBox('🗑',t('binEmpty')));return w}

    const dl=mk('button','ibtn gx gdel','🗑');dl.title=t('delForever');dl.onclick=ev=>{ev.stopPropagation();purgeRec(rec,e)};
    r.append(ic,info,rs,dl);

const restoreRec=G(async rec=>{

  const td=await trashDir(),sub=await td.getDirectoryHandle(rec.id);

async function purgeTrash(){

  const L=trashList(),cut=Date.now()-30*864e5,old=L.filter(r=>r.ts<cut);if(!old.length)return;
  try{const td=await trashDir();for(const r of old){try{await td.removeEntry(r.id,{recursive:true})}catch(x){}}}catch(x){}

const PRIV={open:false};
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pinHash(pin,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},k,256));
}
const askPin=(title,msg)=>dlg({title,msg,input:'',secret:true,ok:t('ok')});
async function ensurePin(){
  if(store.get('pin'))return true;
  const a=await askPin(t('setPin'),t('pinHint'));if(a==null||a==='')return false;
  if(!/^\d{4,}$/.test(a)){toast(t('pinShort'));return false}
  const b=await askPin(t('confirmPin'),'');if(b!==a){toast(t('pinBad'));return false}
  const salt=crypto.getRandomValues(new Uint8Array(16));
  store.set('pin',{s:b64(salt),h:b64(await pinHash(a,salt))});return true;
}
const openPrivate=G(async()=>{
  if(!store.get('pin')){if(!(await ensurePin()))return}
  else{
    const p=store.get('pin'),v=await askPin(t('enterPin'),'');if(v==null||v==='')return;
    if(b64(await pinHash(v,unb64(p.s)))!==p.h){toast(t('pinWrong'));return}
  }
  await dirAt([PRIVD],true);PRIV.open=true;nav({mode:'dir',path:[PRIVD]});
});
const opToPrivate=G(async es=>{
  if(!(await ensurePin()))return;
  const dd=await dirAt([PRIVD],true);
  for(const e of es){
    if(e.path.split('/')[0]===PRIVD)continue;
    let mv=false;
    if(e.h.move){try{await e.h.move(dd,e.name);mv=true}catch(x){}}
    if(!mv){await copyTo(e.h,e.kind,dd,e.name);const sd=await dirAt(parentParts(e.path),false);await sd.removeEntry(e.name,{recursive:true})}
  }
  clearSel();libDirty();toast(t('movedPriv'));
});

/* ---- Clean: duplicates / large / old ---- */
const CRCC=new Map();
async function crcOf(e){const k=e.path+'|'+e.size+'|'+e.mtime;if(CRCC.has(k))return CRCC.get(k);const v=await crcOfBlob(e.f);CRCC.set(k,v);return v}
async function findDups(){
  const all=await getAll(),by=new Map(),groups=[];
  all.forEach(e=>{if(e.size>0){const a=by.get(e.size)||[];a.push(e);by.set(e.size,a)}});
  for(const a of by.values()){
    if(a.length<2)continue;
    const m=new Map();
    for(const e of a){const c=await crcOf(e),g=m.get(c)||[];g.push(e);m.set(c,g)}
    m.forEach(g=>{if(g.length>1)groups.push(g.sort((x,y)=>x.mtime-y.mtime))});
  }
  return groups;
}
const LARGE=25*1048576,OLDMS=60*864e5;
async function viewClean(){
  const all=await getAll(),w=mk('div');
  w.append(mk('div','gnote',t('cleanNote')));
  const dups=await findDups();
  const extraN=dups.reduce((n,g)=>n+g.length-1,0),extra=dups.reduce((n,g)=>n+g.slice(1).reduce((a,e)=>a+e.size,0),0);
  const large=all.filter(e=>e.size>=LARGE),old=all.filter(e=>e.mtime<Date.now()-OLDMS);
  const sum=a=>a.reduce((n,e)=>n+e.size,0);
  const card=(ico,col,title,sub,go)=>{
    const d=mk('div','gcl'),ci=mk('div','ci',ico);ci.style.background=col+'2b';
    const i=mk('div','ginfo');i.append(mk('b',null,title),mk('span',null,sub));d.append(ci,i,mk('div','chev','›'));d.onclick=go;return d;
  };
  const g=mk('div','gf-list');
  g.append(card('👯','#3b82f6',t('cDups'),extraN?t('dupInfo').replace('{n}',extraN).replace('{s}',fmt(extra)):t('none'),()=>nav({mode:'cat',cat:'dups'})));
  g.append(card('🐘','#ef4444',t('cLarge'),large.length?large.length+' · '+fmt(sum(large)):t('none'),()=>nav({mode:'cat',cat:'large'})));
  g.append(card('🕰️','#f59e0b',t('cOld'),old.length?old.length+' · '+fmt(sum(old)):t('none'),()=>nav({mode:'cat',cat:'old'})));
  const tl=trashList();
  g.append(card('🗑','#8b5cf6',t('binT'),tl.length?tl.length+' · '+fmt(tl.reduce((a,r)=>a+r.size,0))+' — '+t('emptyBinHint'):t('binEmpty'),()=>nav({mode:'bin'})));
  const parts=await partInfo();
  if(parts.length)g.insertBefore(card('⏳','#f97316',t('cPart'),parts.length+' · '+fmt(parts.reduce((a,x)=>a+x.size,0))+' — '+t('partNote'),delParts),g.firstChild);
  w.append(g);LIB.cur=[];return w;
}
async function partInfo(){
  const out=[],P=store.get('part',{});
  for(const k of Object.keys(P)){
    const rec=P[k];
    try{const d=await dirAt(rec.dir?rec.dir.split('/'):[],false),f=await (await d.getFileHandle(rec.name+'.part')).getFile();out.push({k,rec,d,size:f.size})}catch(e){}
  }
  return out;
}
const delParts=G(async()=>{
  const ps=await partInfo();if(!ps.length)return;
  const ok=await dlg({title:t('delParts'),msg:ps.map(x=>x.rec.name+' — '+fmt(x.size)).join('\n'),ok:t('del'),danger:true});if(!ok)return;
  const P=store.get('part',{});
  for(const x of ps){try{await x.d.removeEntry(x.rec.name+'.part')}catch(e){}delete P[x.k]}
  store.set('part',P);libDirty();toast(t('partsDeleted'));
});

/* ================= history ================= */
function histRender(){
  const box=$('#histList');box.innerHTML='';const h=store.get('hist',[]);
  if(!h.length){box.innerHTML='<div class="empty">'+t('noHist')+'</div>';return}
  {
    const ok=h.filter(o=>!o.x&&!o.err),out=ok.filter(o=>o.d==='out'),inn=ok.filter(o=>o.d==='in'),bad=h.filter(o=>o.err);
    const sum=a=>a.reduce((n,o)=>n+(o.s||0),0),sp=ok.filter(o=>o.sp>0),avg=sp.length?sp.reduce((n,o)=>n+o.sp,0)/sp.length:0;
    const c=document.createElement('div');c.className='gnote';c.style.whiteSpace='normal';
    c.innerHTML='<b></b><div class="rep"></div>';c.querySelector('b').textContent=t('repT');
    c.querySelector('.rep').textContent='↑ '+t('repSent')+': '+t('repFiles').replace('{n}',out.length)+' · '+fmt(sum(out))+'   ↓ '+t('repRecv')+': '+t('repFiles').replace('{n}',inn.length)+' · '+fmt(sum(inn))+(avg?'   ⚡ '+t('repAvg')+': '+fmt(avg)+'/s':'')+(bad.length?'   ✕ '+t('repFail')+': '+bad.length:'');
    box.append(c);
  }
  h.forEach(o=>{
    const d=document.createElement('div');d.className='item '+(o.d==='in'?'in':'');
    d.innerHTML='<div class="ic"></div><div class="mid"><div class="nm"></div><div class="sub"></div></div>';
    d.querySelector('.ic').textContent=o.x?'💬':(o.d==='out'?'↑':'↓');d.querySelector('.nm').textContent=o.n;
    d.querySelector('.sub').textContent=(o.err?t('histFailed')+' '+o.err+' · ':'')+(o.s?fmt(o.s)+' · ':'')+(o.p?o.p+' · ':'')+(o.sp?fmt(o.sp)+'/s · ':'')+(o.dur>1000?fmtT(o.dur/1000)+' · ':'')+(o.v?'✓ · ':'')+new Date(o.ts).toLocaleString();
    box.append(d);
  });
}

drop.addEventListener('drop',async e=>{
  const items=[...(e.dataTransfer.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(!items.length)return sendFiles(fromList(e.dataTransfer.files));
  const out=[];
  const rd=en=>new Promise(r=>en.createReader().readEntries(r));
  async function go(en,pre){
    if(en.isFile){const f=await new Promise(r=>en.file(r));out.push({file:f,name:pre+en.name})}
    else{let all=[],b;const rdr=en.createReader();do{b=await new Promise(r=>rdr.readEntries(r));all=all.concat([...b])}while(b.length);for(const x of all)await go(x,pre+en.name+'/')}
  }
  for(const en of items)await go(en,'');
  sendFiles(out);
});

function loadLib(urls,test){
  return new Promise(res=>{
    let i=0;
    (function next(){
      if(test()){res(true);return}
      if(i>=urls.length){res(false);return}
      const s=document.createElement('script');s.src=urls[i++];s.onload=next;s.onerror=next;document.head.appendChild(s);
    })();
  });
}
